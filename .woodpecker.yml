when:
  - event: [pull_request, push]
    branch: main

clone:
  git:
    image: woodpeckerci/plugin-git:2.12.1@sha256:b8d2401997be68ec25d62bd753fe5d30236e029fe007a5e823177e0e485ae205
    settings:
      depth: 0
      partial: false
      tags: true
      lfs: false
      recursive: false

steps:
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - gitleaks git --redact --log-opts="--full-history --diff-merges=first-parent HEAD" .

  quality:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
    commands:
      - uv sync --frozen
      - uv run --frozen ruff format --check .
      - uv run --frozen ruff check .
      - uv run --frozen pytest
